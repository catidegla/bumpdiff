name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # A supply chain inspector with a supply chain is an argument in a
      # circle. The dependency count is a claim and a lockfile is the proof it
      # stopped being true.
      - name: No dependencies were added
        shell: bash
        run: |
          test ! -f package-lock.json || (echo "a lockfile appeared" && exit 1)
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) { console.error('dependencies appeared'); process.exit(1); }"

      - name: Test
        run: npm test

  live:
    name: Against real packages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # The offline suite proves the logic. This proves the tarballs npm
      # actually serves still parse, which is a different thing and the one
      # that would break silently. Allowed to fail, because a registry outage
      # is not a defect in this repository.
      - name: Real tarballs still parse and compare
        run: |
          node bin/bumpdiff.mjs chalk --from 4.1.2 --to 5.0.0 --json > chalk.json || true
          node -e "
            const r = require('./chalk.json');
            if (!r.findings.some(f => f.kind === 'capability-gained')) throw new Error('expected the os capability chalk 5 gained');
            if (r.findings.some(f => f.kind === 'host-added')) throw new Error('readme hosts leaked back into findings');
            console.log('live check passed:', r.findings.length, 'findings');
          "

  action:
    name: The action runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The paths that must never block a merge, tested where the registry
      # cannot make them flaky. A base that cannot be reached and a lockfile
      # that did not move both have to pass quietly.
      - id: unreachable
        uses: ./
        with:
          base-ref: 0000000000000000000000000000000000000000

      - name: An unreachable base reports nothing and passes
        run: |
          [ "${{ steps.unreachable.outputs.findings }}" = "0" ] || { echo "invented findings with nothing to compare"; exit 1; }

      - id: unchanged
        uses: ./
        with:
          base-ref: ${{ github.sha }}

      - name: A lockfile that did not move reports nothing and passes
        run: |
          [ "${{ steps.unchanged.outputs.findings }}" = "0" ] || { echo "invented findings on an unchanged lockfile"; exit 1; }
          echo "both quiet paths stay quiet"

      - name: The summary reads a real report
        run: |
          node bin/bumpdiff.mjs --help > /dev/null
          cat > sample.json <<'JSON'
          [{"name":"chalk","versions":{"from":"4.1.2","to":"5.0.0"},
            "findings":[{"severity":"review","summary":"it now reads machine and user details","evidence":"import os from 'node:os';"},
                        {"severity":"context","summary":"published 119 days after the previous version"}]}]
          JSON
          out=$(node .github/summary.mjs sample.json 2> count.txt)
          [ "$(cat count.txt)" = "1" ] || { echo "expected 1 counted finding, got $(cat count.txt)"; exit 1; }
          echo "$out" | grep -q "it now reads machine and user details" || { echo "the finding is missing from the summary"; exit 1; }
          echo "$out" | grep -q "published 119 days" && { echo "background findings should not reach the summary"; exit 1; }
          echo "the summary reports what is worth reading and drops the rest"
